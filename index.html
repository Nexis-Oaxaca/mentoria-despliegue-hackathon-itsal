<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Despliega tu proyecto a costo $0 · Mentoría ITSAL</title>
    <meta
      name="description"
      content="Guía práctica para desplegar gratis el frontend de tu proyecto de hackathon y entender tus opciones de backend. Mentoría de Joan Garfias en el ITSAL."
    />
    <meta name="theme-color" content="#0f766e" />

    <!-- Open Graph: así se ve el enlace en WhatsApp, Facebook y LinkedIn.
         Estas etiquetas deben estar en el HTML: los bots de vista previa no ejecutan JavaScript.
         og:url y og:image necesitan la URL absoluta del sitio publicado. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:site_name" content="Mentoría ITSAL" />
    <meta property="og:title" content="Despliega tu proyecto a costo $0" />
    <meta
      property="og:description"
      content="Ya lo tienes listo. Ahora vamos a subirlo. Guía práctica para desplegar gratis tu proyecto de hackathon."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Despliega tu proyecto a costo $0. Mentoría ITSAL." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

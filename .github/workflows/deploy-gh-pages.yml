# Publica este sitio en GitHub Pages (bonus de la mentoría).
# Basado en el workflow oficial de la guía de Vite: https://vite.dev/guide/static-deploy#github-pages
#
# Antes de usarlo: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Por ahora solo se corre a mano (Actions → Deploy to GitHub Pages → Run workflow).
# Cuando Pages esté activado, puedes agregar el disparador `push` a main.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # El sitio vive en https://<org>.github.io/<repo>/, así que Vite necesita ese `base`.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # GitHub Pages no tiene fallback de SPA: copiamos index.html como 404.html.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
